name: Build

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-full
            os: windows-2022
            script: dist
          - name: windows-x64
            os: windows-2022
            script: dist:64
          - name: windows-x64-unpacked
            os: windows-2022
            script: dist:unpacked
          - name: linux-x64
            os: ubuntu-latest
            script: dist:linux

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Setup MSVC 2022
        if: ${{ matrix.os == 'windows-2022' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure node-gyp (Windows)
        if: ${{ matrix.os == 'windows-2022' }}
        run: |
          echo "PYTHON=python3.9" >> $GITHUB_ENV
          echo "npm_config_python=python3.9" >> $GITHUB_ENV
          echo "npm_config_msvs_version=2022" >> $GITHUB_ENV
        shell: bash

      - name: Setup Python (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Setup Linux Dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libx11-dev libxkbfile-dev libsecret-1-dev \
            fakeroot rpm dpkg libarchive-tools desktop-file-utils \
            libgdk-pixbuf2.0-dev libffi-dev shared-mime-info libappimage-dev fuse

      - uses: actions/setup-node@v4
        with:
          node-version: '16.14.2'
          cache: 'yarn'

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/cache
          key: ${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-
            ${{ runner.os }}-

      - name: Clean Old Cache
        run: rm -rf .yarn/v6/.tmp node_modules/.cache
        continue-on-error: true
        shell: bash

      - name: Install Dependencies
        run: yarn install --network-timeout 100000

      - name: Build App
        run: yarn run ${{ matrix.script }} --publish never

      - name: Upload Windows Installer
        if: ${{ matrix.os == 'windows-2022' && matrix.name != 'windows-x64-unpacked' }}
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink-${{ matrix.name }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows Unpacked
        if: ${{ matrix.name == 'windows-x64-unpacked' }}
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink-${{ matrix.name }}
          path: dist/win-unpacked
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink-${{ matrix.name }}
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30