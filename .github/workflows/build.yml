name: Build

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
         - os: windows-latest
           build_command: 'dist:all'
           installer_pattern: 'dist/Better-CrewLink Setup*.exe'
           artifact_name: 'BetterCrewLink Windows'
         - os: ubuntu-latest
           build_command: 'dist:linux'
           installer_pattern: 'dist/Better-CrewLink-*.AppImage'
           artifact_name: 'BetterCrewLink Linux'


    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.14.2
          cache: 'yarn'

      - name: Cache Node Modules
        id: node-cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .yarn
          key: ${{ runner.os }}-3-${{ hashFiles('yarn.lock')}}


      - name: Install Dependencies
        run: yarn install --frozen-lockfile --network-timeout 100000

      - name: Build Application
        run: yarn run ${{ matrix.build_command }} --publish never

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.installer_pattern }}
          if-no-files-found: error

      - name: Upload Unpacked (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BetterCrewLink Unpacked Windows
          path: dist/win-unpacked